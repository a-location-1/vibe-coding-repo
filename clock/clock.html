<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Clock</title>
<style>
  :root {
    --yaw: 0deg;
    --pitch: 0deg;
    --ink: #26313b;
    --muted: #71808b;
    --wood: #765442;
    --brass: #c89542;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background: #dce5e8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .viewport {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    perspective: 1000px;
    perspective-origin: 50% 46%;
    cursor: grab;
    touch-action: none;
  }
  .viewport.is-dragging { cursor: grabbing; }

  .room {
    position: absolute;
    inset: -18vh -18vw;
    transform-style: preserve-3d;
    transform: rotateX(var(--pitch)) rotateY(var(--yaw));
    transition: transform 900ms cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .room.is-dragging { transition: none; }

  .wall, .floor, .ceiling {
    position: absolute;
    backface-visibility: hidden;
  }
  .wall {
    inset: 0;
    background:
      linear-gradient(90deg, rgba(89,111,120,.12) 1px, transparent 1px) 0 0 / 150px 150px,
      linear-gradient(rgba(89,111,120,.08) 1px, transparent 1px) 0 0 / 150px 150px,
      #f8faf8;
    box-shadow: inset 0 0 180px rgba(104,126,133,.25);
    transform: translateZ(-430px);
  }
  .wall::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, rgba(255,255,255,.55), transparent 42%, rgba(115,132,137,.12));
  }
  .floor {
    inset: 0;
    background:
      linear-gradient(90deg, rgba(93,71,55,.12) 2px, transparent 2px) 0 0 / 130px 100%,
      repeating-linear-gradient(0deg, #d6c6b5 0 4px, #c8b6a4 5px 7px);
    transform: rotateX(90deg) translateZ(-430px);
    transform-origin: center bottom;
    box-shadow: inset 0 80px 110px rgba(78,61,49,.24);
  }
  .ceiling {
    inset: 0;
    background: #eef3f1;
    transform: rotateX(-90deg) translateZ(-430px);
    transform-origin: center top;
  }

  .window {
    position: absolute;
    width: 290px;
    height: 210px;
    left: 10%;
    top: 22%;
    border: 14px solid #fff;
    background:
      linear-gradient(145deg, rgba(255,255,255,.75), transparent 55%),
      linear-gradient(#9fc8d7, #e1f1ef 65%, #a8c3ad);
    box-shadow: 0 8px 24px rgba(53,70,78,.2), inset 0 0 0 7px #b9c9c9;
    transform: translateZ(-421px);
  }
  .window::before, .window::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(90,110,117,.12);
  }
  .window::before { width: 8px; inset: 0 50%; }
  .window::after { height: 8px; inset: 50% 0; }

  .clock-shadow {
    position: absolute;
    width: min(390px, 42vw);
    aspect-ratio: 1;
    left: 50%;
    top: 41%;
    border-radius: 50%;
    background: rgba(43,54,57,.2);
    filter: blur(25px);
    transform: translate(-50%, -50%) translate3d(20px, 24px, -412px);
  }
  .clock {
    position: absolute;
    width: min(390px, 42vw);
    aspect-ratio: 1;
    left: 50%;
    top: 41%;
    border-radius: 50%;
    padding: 18px;
    background: linear-gradient(145deg, #9d7255, var(--wood) 55%, #4f352a);
    box-shadow: 0 14px 0 #4d352b, 0 20px 34px rgba(36,43,43,.32), inset 2px 2px 8px rgba(255,255,255,.2);
    transform: translate(-50%, -50%) translateZ(-410px);
  }
  .face {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #fffefa, #f1eee5 68%, #d7d2c7);
    border: 5px solid var(--brass);
    box-shadow: inset 0 0 0 5px #f7f5ed, inset 0 0 20px rgba(43,47,45,.18);
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 46%;
    background: transparent;
    transform: translate(-50%, -50%) rotate(var(--angle));
  }
  .tick::before {
    content: "";
    display: block;
    width: 100%;
    height: 13px;
    border-radius: 2px;
    background: #3e4a4b;
  }
  .tick.major { width: 5px; }
  .tick.major::before { height: 20px; background: #29373a; }
  .number {
    position: absolute;
    font-family: Georgia, serif;
    font-size: clamp(1.05rem, 2.5vw, 1.65rem);
    font-weight: 700;
    transform: translate(-50%, -50%);
  }
  .n12 { left: 50%; top: 10%; }
  .n3 { left: 90%; top: 50%; }
  .n6 { left: 50%; top: 90%; }
  .n9 { left: 10%; top: 50%; }
  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 7px;
    height: 31%;
    border-radius: 8px;
    background: #29373a;
    transform-origin: 50% 100%;
    transform: translateX(-50%) rotate(var(--rotation));
    box-shadow: 1px 1px 3px rgba(30,35,35,.25);
  }
  .hand.hour { width: 10px; height: 23%; }
  .hand.second { width: 2px; height: 37%; background: #bd4d3e; }
  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--brass);
    border: 3px solid #67502f;
    transform: translate(-50%, -50%);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(20px, 4vw, 48px);
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.28), transparent 28%, transparent 72%, rgba(54,63,66,.12));
  }
  .title, .readout {
    width: fit-content;
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 14px;
    background: rgba(255,255,255,.48);
    box-shadow: 0 8px 24px rgba(53,70,78,.1);
    backdrop-filter: blur(8px);
  }
  .title { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; }
  .readout { align-self: flex-end; text-align: right; }
  .time {
    font-size: clamp(1.5rem, 4vw, 2.7rem);
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .date { margin-top: 2px; color: var(--muted); font-size: .78rem; }
  .hint {
    position: absolute;
    left: 50%;
    bottom: 24px;
    margin: 0;
    color: rgba(38,49,59,.65);
    font-size: .75rem;
    letter-spacing: .08em;
    text-align: center;
    text-transform: uppercase;
    transform: translateX(-50%);
  }
  @media (max-width: 600px) {
    .window { width: 190px; height: 150px; left: -2%; }
    .clock, .clock-shadow { width: min(300px, 66vw); }
    .clock { padding: 13px; }
    .hint { bottom: 16px; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .room { transition: none; }
  }
</style>
</head>
<body>
<main class="viewport" id="viewport" aria-label="Interactive three-dimensional room with a wall clock">
  <div class="room" id="room">
    <div class="wall"></div>
    <div class="ceiling"></div>
    <div class="floor"></div>
    <div class="window" aria-hidden="true"></div>
    <div class="clock-shadow" aria-hidden="true"></div>
    <section class="clock" aria-label="Analog local time clock">
      <div class="face">
        <span class="tick major" style="--angle: 0deg"></span>
        <span class="tick" style="--angle: 30deg"></span>
        <span class="tick" style="--angle: 60deg"></span>
        <span class="tick major" style="--angle: 90deg"></span>
        <span class="tick" style="--angle: 120deg"></span>
        <span class="tick" style="--angle: 150deg"></span>
        <span class="tick major" style="--angle: 180deg"></span>
        <span class="tick" style="--angle: 210deg"></span>
        <span class="tick" style="--angle: 240deg"></span>
        <span class="tick major" style="--angle: 270deg"></span>
        <span class="tick" style="--angle: 300deg"></span>
        <span class="tick" style="--angle: 330deg"></span>
        <span class="number n12">12</span><span class="number n3">3</span>
        <span class="number n6">6</span><span class="number n9">9</span>
        <span class="hand hour" id="hourHand"></span>
        <span class="hand minute" id="minuteHand"></span>
        <span class="hand second" id="secondHand"></span>
        <span class="hub"></span>
      </div>
    </section>
  </div>
  <div class="overlay">
    <div class="title">Local time · wall clock</div>
    <div class="readout" aria-live="polite">
      <div class="time" id="digitalTime"></div>
      <div class="date" id="date"></div>
    </div>
  </div>
  <p class="hint">Drag to look around · release to recenter</p>
</main>
<script>
  const viewport = document.getElementById("viewport");
  const room = document.getElementById("room");
  const hourHand = document.getElementById("hourHand");
  const minuteHand = document.getElementById("minuteHand");
  const secondHand = document.getElementById("secondHand");
  const digitalTime = document.getElementById("digitalTime");
  const date = document.getElementById("date");
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let yaw = 0;
  let pitch = 0;

  function updateClock() {
    const now = new Date();
    const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
    const minutes = now.getMinutes() + seconds / 60;
    const hours = (now.getHours() % 12) + minutes / 60;
    hourHand.style.setProperty("--rotation", `${hours * 30}deg`);
    minuteHand.style.setProperty("--rotation", `${minutes * 6}deg`);
    secondHand.style.setProperty("--rotation", `${seconds * 6}deg`);
    digitalTime.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
    date.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  }

  function setView(nextYaw, nextPitch) {
    yaw = Math.max(-28, Math.min(28, nextYaw));
    pitch = Math.max(-18, Math.min(18, nextPitch));
    room.style.setProperty("--yaw", `${yaw}deg`);
    room.style.setProperty("--pitch", `${pitch}deg`);
  }

  viewport.addEventListener("pointerdown", (event) => {
    pointerId = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
    viewport.setPointerCapture(pointerId);
    viewport.classList.add("is-dragging");
    room.classList.add("is-dragging");
  });

  viewport.addEventListener("pointermove", (event) => {
    if (event.pointerId !== pointerId) return;
    setView((event.clientX - startX) / 8, (startY - event.clientY) / 8);
  });

  function recenter(event) {
    if (event.pointerId !== pointerId) return;
    pointerId = null;
    viewport.classList.remove("is-dragging");
    room.classList.remove("is-dragging");
    setView(0, 0);
  }

  viewport.addEventListener("pointerup", recenter);
  viewport.addEventListener("pointercancel", recenter);
  updateClock();
  setInterval(updateClock, 250);
</script>
</body>
</html>
