<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Clock</title>
<style>
  :root {
    --yaw: 0deg;
    --pitch: 0deg;
    --room-color: #f8f7f2;
    --room-depth: 620px;
    --wall-overhang: 120px;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--room-color);
  }

  .viewport {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    perspective: 1000px;
    perspective-origin: 50% 46%;
    cursor: grab;
    touch-action: none;
  }
  .viewport.is-dragging { cursor: grabbing; }

  .room {
    position: absolute;
    inset: -18vh -18vw;
    transform-style: preserve-3d;
    transform: rotateX(var(--pitch)) rotateY(var(--yaw));
    transition: transform 900ms cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .room.is-dragging { transition: none; }

  .wall, .side-wall, .floor, .ceiling {
    position: absolute;
    backface-visibility: visible;
  }
  .wall {
    inset: 0;
    background: var(--room-color);
    box-shadow: inset 0 0 180px rgba(110,110,110,.2), inset 0 -3px 0 rgba(92,88,80,.2);
    transform: translateZ(calc(var(--room-depth) * -1));
  }
  .side-wall {
    top: 0;
    width: calc(var(--room-depth) + var(--wall-overhang));
    height: 100%;
    background: var(--room-color);
    box-shadow: inset 0 0 130px rgba(110,110,110,.2), inset 0 -3px 0 rgba(92,88,80,.2);
  }
  .side-wall.left {
    left: 0;
    transform-origin: left center;
    transform: translateZ(calc(var(--room-depth) * -1)) rotateY(-90deg);
  }
  .side-wall.right {
    left: calc(100% - var(--room-depth) - var(--wall-overhang));
    transform-origin: right center;
    transform: translateZ(calc(var(--room-depth) * -1)) rotateY(90deg);
  }
  .floor {
    top: 100%;
    left: 0;
    width: 100%;
    height: 1100px;
    background: linear-gradient(180deg, #e7e5df 0%, var(--room-color) 16%, var(--room-color) 100%);
    transform: translateZ(calc(var(--room-depth) * -1)) rotateX(90deg);
    transform-origin: center top;
    box-shadow: inset 0 80px 110px rgba(110,110,110,.22), inset 0 3px 0 rgba(92,88,80,.2);
  }
  .ceiling {
    top: auto;
    bottom: 100%;
    left: 0;
    width: 100%;
    height: 1100px;
    background: linear-gradient(180deg, var(--room-color) 0%, #e8e6e0 100%);
    transform: translateZ(calc(var(--room-depth) * -1)) rotateX(-90deg);
    transform-origin: center bottom;
    box-shadow: inset 0 -80px 110px rgba(110,110,110,.16), inset 0 -3px 0 rgba(92,88,80,.16);
  }

  .clock-shadow {
    position: absolute;
    width: min(150px, 17vw);
    aspect-ratio: 1;
    left: 50%;
    top: 38%;
    border-radius: 50%;
    background: rgba(0,0,0,.24);
    filter: blur(25px);
    transform: translate(-50%, -50%) translate3d(5px, 6px, -617px);
  }
  .clock {
    position: absolute;
    width: min(150px, 17vw);
    aspect-ratio: 1;
    left: 50%;
    top: 38%;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(145deg, #363636, #111 55%, #050505);
    box-shadow: 0 2px 0 #050505, 0 7px 16px rgba(0,0,0,.28), inset 2px 2px 8px rgba(255,255,255,.14);
    transform: translate(-50%, -50%) translateZ(-619px) rotateX(0deg) rotateY(0deg);
  }
  .face {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #fffefa, #f1eee5 68%, #d7d2c7);
    border: 3px solid #171717;
    box-shadow: inset 0 0 0 5px #f7f5ed, inset 0 0 20px rgba(0,0,0,.24);
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 50%;
    background: transparent;
    transform: translate(-50%, -100%) rotate(var(--angle));
    transform-origin: 50% 100%;
  }
  .tick::before {
    content: "";
    display: block;
    width: 100%;
    height: 7px;
    border-radius: 2px;
    background: #111;
  }
  .tick.major { width: 3px; }
  .tick.major::before { height: 13px; background: #000; }
  .number {
    position: absolute;
    font-family: Georgia, serif;
    width: 1.5em;
    font-size: clamp(.4rem, 1.5vw, .8rem);
    font-weight: 700;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
    transform: translate(-50%, -50%);
  }
  .n12 { left: 50%; top: 17%; }
  .n1 { left: 65%; top: 21%; }
  .n2 { left: 77%; top: 33%; }
  .n3 { left: 83%; top: 50%; }
  .n4 { left: 77%; top: 67%; }
  .n5 { left: 65%; top: 79%; }
  .n6 { left: 50%; top: 83%; }
  .n7 { left: 35%; top: 79%; }
  .n8 { left: 23%; top: 67%; }
  .n9 { left: 17%; top: 50%; }
  .n10 { left: 23%; top: 33%; }
  .n11 { left: 35%; top: 21%; }
  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 4px;
    height: 31%;
    border-radius: 8px;
    background: #111;
    transform-origin: 50% 100%;
    transform: translateX(-50%) rotate(var(--rotation));
    box-shadow: 1px 1px 3px rgba(30,35,35,.25);
  }
  .hand.hour { width: 6px; height: 23%; }
  .hand.second { width: 2px; height: 37%;   background: #333; }
  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #111;
    border: 3px solid #000;
    transform: translate(-50%, -50%);
  }

  @media (max-width: 600px) {
    .clock, .clock-shadow { width: min(120px, 28vw); }
    .clock { padding: 3px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .room { transition: none; }
  }
</style>
</head>
<body>
<main class="viewport" id="viewport" aria-label="Interactive three-dimensional room with a wall clock">
  <div class="room" id="room">
    <div class="wall"></div>
    <div class="ceiling"></div>
    <div class="floor"></div>
    <div class="side-wall left"></div>
    <div class="side-wall right"></div>
    <div class="clock-shadow" aria-hidden="true"></div>
    <section class="clock" aria-label="Analog local time clock">
      <div class="face">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
        <span class="number n12">12</span><span class="number n1">1</span>
        <span class="number n2">2</span><span class="number n3">3</span>
        <span class="number n4">4</span><span class="number n5">5</span>
        <span class="number n6">6</span><span class="number n7">7</span>
        <span class="number n8">8</span><span class="number n9">9</span>
        <span class="number n10">10</span><span class="number n11">11</span>
        <span class="hand hour" id="hourHand"></span>
        <span class="hand minute" id="minuteHand"></span>
        <span class="hand second" id="secondHand"></span>
        <span class="hub"></span>
      </div>
    </section>
  </div>
</main>
<script>
  const viewport = document.getElementById("viewport");
  const room = document.getElementById("room");
  const hourHand = document.getElementById("hourHand");
  const minuteHand = document.getElementById("minuteHand");
  const secondHand = document.getElementById("secondHand");
  const ticks = document.getElementById("ticks");
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let yaw = 0;
  let pitch = 0;

  for (let index = 0; index < 60; index += 1) {
    const tick = document.createElement("span");
    tick.className = index % 5 === 0 ? "tick major" : "tick";
    tick.style.setProperty("--angle", `${index * 6}deg`);
    ticks.append(tick);
  }

  function updateClock() {
    const now = new Date();
    const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
    const minutes = now.getMinutes() + seconds / 60;
    const hours = (now.getHours() % 12) + minutes / 60;
    hourHand.style.setProperty("--rotation", `${hours * 30}deg`);
    minuteHand.style.setProperty("--rotation", `${minutes * 6}deg`);
    secondHand.style.setProperty("--rotation", `${seconds * 6}deg`);
  }

  function setView(nextYaw, nextPitch) {
    yaw = Math.max(-20, Math.min(20, nextYaw));
    pitch = Math.max(-12, Math.min(12, nextPitch));
    room.style.setProperty("--yaw", `${yaw}deg`);
    room.style.setProperty("--pitch", `${pitch}deg`);
  }

  viewport.addEventListener("pointerdown", (event) => {
    pointerId = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
    viewport.setPointerCapture(pointerId);
    viewport.classList.add("is-dragging");
    room.classList.add("is-dragging");
  });

  viewport.addEventListener("pointermove", (event) => {
    if (event.pointerId !== pointerId) return;
    setView((event.clientX - startX) / 8, (startY - event.clientY) / 8);
  });

  function recenter(event) {
    if (event.pointerId !== pointerId) return;
    pointerId = null;
    viewport.classList.remove("is-dragging");
    room.classList.remove("is-dragging");
    setView(0, 0);
  }

  viewport.addEventListener("pointerup", recenter);
  viewport.addEventListener("pointercancel", recenter);
  updateClock();
  setInterval(updateClock, 250);
</script>
</body>
</html>
