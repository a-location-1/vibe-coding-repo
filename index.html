<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Array</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a64;
    --border: #dcdad2; --accent: #3b5bdb; --accent-text: #fff;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --glow: none; --radius: 12px;
  }
  [data-theme="dark"] {
    --bg: #14151a; --panel: #1e2027; --text: #ececea; --muted: #9a9a94;
    --border: #33353e; --accent: #7c93ff; --accent-text: #10121a;
  }
  [data-theme="neon"] {
    --bg: #000; --panel: rgba(0,12,0,.82); --text: #00ff41; --muted: #00a82a;
    --border: #00ff41; --accent: #00ff41; --accent-text: #000;
    --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --glow: 0 0 8px rgba(0,255,65,.55); --radius: 2px;
  }
  [data-theme="cloud"] {
    --bg: #b9ddf5; --panel: rgba(255,255,255,.72); --text: #23445f; --muted: #58758b;
    --border: rgba(61,113,145,.28); --accent: #e69b35; --accent-text: #fff;
    --font: "Trebuchet MS", "Segoe UI", sans-serif; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font); transition: background .2s, color .2s;
  }
  #cloudscape { position: fixed; inset: 0; z-index: 0; display: none; overflow: hidden; pointer-events: none; }
  [data-theme="cloud"] #cloudscape { display: block; background: linear-gradient(#8ec8ee 0 58%, #d9eef9 58% 100%); }
  #cloudscape::before {
    position: absolute; right: -5%; top: calc(58% - 55px); left: -5%; z-index: 1; height: 110px;
    background: #f7fcff;
    clip-path: polygon(0 50%, 2.5% 35%, 5% 20%, 7.5% 35%, 10% 50%, 12.5% 65%, 15% 80%, 17.5% 65%, 20% 50%, 22.5% 35%, 25% 20%, 27.5% 35%, 30% 50%, 32.5% 65%, 35% 80%, 37.5% 65%, 40% 50%, 42.5% 35%, 45% 20%, 47.5% 35%, 50% 50%, 52.5% 65%, 55% 80%, 57.5% 65%, 60% 50%, 62.5% 35%, 65% 20%, 67.5% 35%, 70% 50%, 72.5% 65%, 75% 80%, 77.5% 65%, 80% 50%, 82.5% 35%, 85% 20%, 87.5% 35%, 90% 50%, 92.5% 65%, 95% 80%, 97.5% 65%, 100% 50%, 100% 100%, 0 100%);
    content: ""; filter: blur(4px);
  }
  .cloud-row {
    position: absolute; right: -10%; left: -10%; height: 145px; filter: blur(5px);
    background: #f7fcff;
    clip-path: polygon(0 28%, 3% 12%, 6% 28%, 9% 44%, 12% 28%, 15% 12%, 18% 28%, 21% 44%, 24% 28%, 27% 12%, 30% 28%, 33% 44%, 36% 28%, 39% 12%, 42% 28%, 45% 44%, 48% 28%, 51% 12%, 54% 28%, 57% 44%, 60% 28%, 63% 12%, 66% 28%, 69% 44%, 72% 28%, 75% 12%, 78% 28%, 81% 44%, 84% 28%, 87% 12%, 90% 28%, 93% 44%, 96% 28%, 100% 12%, 100% 100%, 0 100%);
  }
  .cloud-row.back { top: 66%; opacity: .7; background: #c9e6f4; }
  .cloud-row.mid { top: 75%; opacity: .85; background: #e2f3fa; }
  .cloud-row.front { top: 84%; background: #f7fcff; }
  #rain { position: fixed; inset: 0; z-index: 0; display: none; opacity: .35; width: 100%; height: 100%; }
  [data-theme="neon"] #rain { display: block; }
  main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.4rem; text-shadow: var(--glow); }
  h1 small { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .themes { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .themes button { border: 0; background: var(--panel); color: var(--text); padding: 8px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .themes button + button { border-left: 1px solid var(--border); }
  .themes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  #list { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { #list { grid-template-columns: 1fr 1fr; } }
  a.card {
    display: flex; flex-direction: column; overflow: hidden; text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--glow); transition: border-color .15s, transform .15s;
  }
  a.card.prototype { position: relative; }
  a.card.prototype::after {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(135deg, transparent 0 12px, #85857f 12px 16px);
    content: ""; opacity: .22;
  }
  a.card.prototype > * { position: relative; z-index: 1; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-2px); }
  .thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: var(--bg); border-bottom: 1px solid var(--border); }
  .body { padding: 14px 16px 16px; }
  .body h2 { margin: 0 0 4px; font-size: 1.05rem; text-shadow: var(--glow); }
  .body h2::after { content: " \2192"; color: var(--accent); }
  .body p { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.4; }
  .legend { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .8rem; }
  .legend-swatch { width: 24px; height: 14px; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, transparent 0 7px, #85857f 7px 11px); opacity: .7; }
  .empty { color: var(--muted); }
  footer { margin-top: 24px; color: var(--muted); font-size: .8rem; }
  footer .attribution { margin-top: 6px; }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="cloudscape" aria-hidden="true">
  <div class="cloud-row back"></div>
  <div class="cloud-row mid"></div>
  <div class="cloud-row front"></div>
</div>
<main>
  <header>
    <h1>Project Array<small>Small projects made with AI agents</small></h1>
    <div class="legend"><span class="legend-swatch" aria-hidden="true"></span> = in progress</div>
    <div class="themes" role="group" aria-label="Theme">
      <button type="button" data-t="light" aria-pressed="false">Light</button>
      <button type="button" data-t="dark" aria-pressed="false">Dark</button>
      <button type="button" data-t="neon" aria-pressed="false">Neon</button>
      <button type="button" data-t="cloud" aria-pressed="false">Cloud</button>
    </div>
  </header>

  <div id="list"></div>
  <footer>
    <div id="count"></div>
    <div class="attribution">Project structure adapted from Paul Kaefer's <a href="https://github.com/paulkaefer/vibe-coding">vibe-coding</a> collection.</div>
  </footer>
</main>

<script>
/* ---------- ADD NEW SITES HERE ----------
   Copy one line, paste it below, edit the fields.
   title, href, desc are required. thumb is optional (any image path/URL).  */
const PROJECTS = [
  { title: "Wall Clock",              href: "clock/clock.html",                         desc: "Check the time.",                                                     status: "keeper",    thumb: "_thumbs/clock.svg" },
  { title: "CORS Practice",           href: "cors_practice/cors-practice.html",         desc: "Learn Cross-Origin Resource Sharing through interactive scenarios.",  status: "keeper",    thumb: "_thumbs/cors-practice.svg" },
  { title: "Not To Do List",          href: "not_to_do_list/not-to-do-list.html",       desc: "Keep track of tasks that should remain unfinished.",                  status: "prototype", thumb: "_thumbs/not-to-do-list.svg" },
  { title: "House Plant",             href: "house_plant/house-plant.html",             desc: "Care for a tiny aloe with very real feelings.",                       status: "prototype", thumb: "_thumbs/house-plant.svg" },
];

/* ---------- render ---------- */
const list = document.getElementById("list");
const visibleProjects = PROJECTS.filter(p => p.status !== "abandoned");
for (const p of visibleProjects) {
  const a = document.createElement("a");
  a.className = "card " + p.status; a.href = p.href;
  if (p.thumb) {
    const img = document.createElement("img");
    img.className = "thumb"; img.src = p.thumb; img.alt = ""; img.loading = "lazy";
    img.onerror = () => img.remove();
    a.append(img);
  }
  const body = document.createElement("div");
  body.className = "body";
  const h = document.createElement("h2"); h.textContent = p.title;
  const d = document.createElement("p"); d.textContent = p.desc || "";
  body.append(h, d); a.append(body); list.append(a);
}
document.getElementById("count").textContent = visibleProjects.length + (visibleProjects.length === 1 ? " project" : " projects");

/* ---------- theme ---------- */
const root = document.documentElement;
const btns = document.querySelectorAll(".themes button");
function setTheme(t) {
  if (t === "light") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
  try { localStorage.setItem("vibes-theme", t); } catch (e) {}
  t === "neon" ? startRain() : stopRain();
}
btns.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.t)));

/* ---------- matrix rain (neon only) ---------- */
const cv = document.getElementById("rain"), cx = cv.getContext("2d");
let timer = null, cols = [];
function sizeRain() { cv.width = innerWidth; cv.height = innerHeight; cols = Array(Math.ceil(cv.width / 16)).fill(0).map(() => Math.random() * cv.height / 16); }
function tick() {
  cx.fillStyle = "rgba(0,0,0,.08)"; cx.fillRect(0, 0, cv.width, cv.height);
  cx.fillStyle = "#00ff41"; cx.font = "14px monospace";
  cols.forEach((y, i) => {
    cx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 16, y * 16);
    cols[i] = y * 16 > cv.height && Math.random() > .975 ? 0 : y + 1;
  });
}
function startRain() { if (timer || matchMedia("(prefers-reduced-motion: reduce)").matches) return; sizeRain(); timer = setInterval(tick, 60); }
function stopRain() { clearInterval(timer); timer = null; }
addEventListener("resize", () => { if (timer) sizeRain(); });

let saved = "light";
try { saved = localStorage.getItem("vibes-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
setTheme(saved);
</script>
</body>
</html>
